<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manga Reader - Локальный просмотрщик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            background: #0a0a0a;
        }

        .top-bar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
            z-index: 10;
            flex-shrink: 0;
            min-height: 60px;
        }

        .top-bar h1 {
            font-size: 18px;
            color: #e94560;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .top-bar-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .top-bar button {
            background: #0f3460;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .top-bar button:active {
            transform: scale(0.95);
        }

        .top-bar button.primary {
            background: #e94560;
        }

        .viewer-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
            touch-action: none;
        }

        .viewer-area .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            padding: 20px;
            width: 90%;
        }

        .viewer-area .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .viewer-area .empty-state h3 {
            color: #999;
            margin-bottom: 8px;
        }

        .viewer-area .empty-state p {
            color: #666;
            font-size: 14px;
        }

        .page-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }

        .page-container img,
        .page-container canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            touch-action: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .page-container canvas {
            width: 100%;
            height: 100%;
        }

        .pdf-viewer-native {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .nav-bar {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #0f3460;
            flex-shrink: 0;
            min-height: 60px;
            gap: 10px;
        }

        .nav-bar .nav-btn {
            background: #e94560;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
            touch-action: manipulation;
        }

        .nav-bar .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-bar .nav-btn:disabled {
            background: #333;
            opacity: 0.5;
        }

        .nav-bar .page-info {
            color: #aaa;
            font-size: 14px;
            text-align: center;
            flex: 1;
            white-space: nowrap;
        }

        .nav-bar .controls-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-bar .controls-right button {
            background: #0f3460;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .nav-bar .controls-right button:active {
            transform: scale(0.9);
        }

        .file-list-container {
            background: #1a1a2e;
            border-top: 1px solid #0f3460;
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
            touch-action: pan-y;
        }

        .file-list-container::-webkit-scrollbar {
            width: 4px;
        }

        .file-list-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .file-list-container::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }

        .file-list {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            overflow-x: auto;
            touch-action: pan-x;
        }

        .file-list::-webkit-scrollbar {
            height: 4px;
        }

        .file-list::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }

        .file-thumb {
            flex: 0 0 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
            background: #0f3460;
            touch-action: manipulation;
        }

        .file-thumb:active {
            transform: scale(0.95);
        }

        .file-thumb.active {
            border-color: #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        .file-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-thumb .file-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 32px;
            color: #e94560;
        }

        .file-thumb .file-name-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 8px;
            padding: 2px 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Модальное окно выбора файлов */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 24px;
            border-radius: 16px;
            max-width: 90%;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #e94560;
            margin-bottom: 16px;
            font-size: 20px;
        }

        .modal-content p {
            color: #aaa;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .modal-content .file-input-area {
            margin: 12px 0;
        }

        .modal-content .file-input-area input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            background: #0f3460;
            border: 2px dashed #e94560;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .modal-content .file-input-area input[type="file"]::-webkit-file-upload-button {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .modal-buttons button:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-secondary {
            background: #0f3460;
            color: white;
        }

        .fullscreen-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .page-container {
            animation: fadeIn 0.2s ease;
        }

        @media (max-width: 480px) {
            .top-bar h1 {
                font-size: 14px;
                max-width: 30%;
            }
            
            .top-bar button {
                padding: 6px 10px;
                font-size: 12px;
            }
            
            .nav-bar {
                padding: 8px 12px;
                min-height: 50px;
            }
            
            .nav-bar .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
                min-width: 50px;
            }
            
            .file-thumb {
                flex: 0 0 60px;
                height: 60px;
            }
            
            .file-list-container {
                max-height: 80px;
            }
            
            .modal-content {
                padding: 16px;
            }
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
            border: 1px solid #e94560;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Для PDF просмотра */
        .pdf-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 5;
        }

        .pdf-controls button {
            background: #e94560;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .pdf-controls span {
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <h1 id="titleDisplay">📚 Manga Reader</h1>
            <div class="top-bar-controls">
                <button id="openFilesBtn" class="primary">📂 Выбрать файлы</button>
            </div>
        </div>

        <div class="viewer-area" id="viewerArea">
            <div class="empty-state" id="emptyState">
                <div class="icon">📖</div>
                <h3>Выберите файлы манги</h3>
                <p>Поддерживаются: JPEG, PNG, PDF</p>
                <p style="font-size: 12px; margin-top: 8px;">Нажмите "Выбрать файлы" в верхней панели</p>
            </div>
            <div class="page-container" id="pageContainer" style="display: none;">
                <canvas id="pdfCanvas" style="display: none;"></canvas>
                <img id="imageViewer" style="display: none;" alt="Страница">
                <iframe id="pdfNativeViewer" class="pdf-viewer-native" style="display: none;"></iframe>
            </div>
        </div>

        <div class="nav-bar" id="navBar">
            <button class="nav-btn" id="prevPage" disabled>◀ Назад</button>
            <span class="page-info" id="pageInfo">0 / 0</span>
            <div class="controls-right">
                <button id="zoomIn" title="Увеличить">+</button>
                <button id="zoomOut" title="Уменьшить">−</button>
                <button id="resetZoom" title="Сбросить масштаб">⟲</button>
                <button id="fullscreenToggle" class="fullscreen-btn" title="Полный экран">⛶</button>
            </div>
        </div>

        <div class="file-list-container" id="fileListContainer">
            <div class="file-list" id="fileList">
                <div style="color: #666; padding: 8px; text-align: center; width: 100%; font-size: 12px;">
                    Нет файлов. Выберите файлы.
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно выбора файлов -->
    <div class="modal-overlay" id="fileModal">
        <div class="modal-content">
            <h2>📂 Выберите файлы манги</h2>
            <p>Выберите изображения или PDF файлы для просмотра.</p>
            <div class="file-input-area">
                <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.gif,.bmp,.webp,.pdf">
            </div>
            <p style="font-size: 12px; color: #666;">
                💡 На Android можно выбрать несколько файлов одновременно.
            </p>
            <div class="modal-buttons">
                <button class="btn-secondary" id="closeModalBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        class MangaReader {
            constructor() {
                this.files = [];
                this.currentIndex = -1;
                this.zoomLevel = 1;
                this.minZoom = 0.5;
                this.maxZoom = 3;
                this.isFullscreen = false;
                this.pdfDoc = null;
                this.currentPage = 1;
                this.totalPages = 0;
                this.isPdf = false;
                this.useNativePdf = true;
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.isSwiping = false;
                
                this.init();
            }

            init() {
                this.cacheElements();
                this.setupEventListeners();
                this.hideModal();
            }

            cacheElements() {
                this.viewerArea = document.getElementById('viewerArea');
                this.pageContainer = document.getElementById('pageContainer');
                this.imageViewer = document.getElementById('imageViewer');
                this.pdfCanvas = document.getElementById('pdfCanvas');
                this.pdfNativeViewer = document.getElementById('pdfNativeViewer');
                this.emptyState = document.getElementById('emptyState');
                this.fileList = document.getElementById('fileList');
                this.pageInfo = document.getElementById('pageInfo');
                this.titleDisplay = document.getElementById('titleDisplay');
                this.prevBtn = document.getElementById('prevPage');
                this.nextBtn = document.getElementById('nextPage');
                this.zoomInBtn = document.getElementById('zoomIn');
                this.zoomOutBtn = document.getElementById('zoomOut');
                this.resetZoomBtn = document.getElementById('resetZoom');
                this.fullscreenBtn = document.getElementById('fullscreenToggle');
                this.openFilesBtn = document.getElementById('openFilesBtn');
                this.fileInput = document.getElementById('fileInput');
                this.fileModal = document.getElementById('fileModal');
                this.closeModalBtn = document.getElementById('closeModalBtn');
                this.navBar = document.getElementById('navBar');
            }

            setupEventListeners() {
                this.openFilesBtn.addEventListener('click', () => {
                    this.showModal();
                });

                this.closeModalBtn.addEventListener('click', () => {
                    this.hideModal();
                });

                this.fileModal.addEventListener('click', (e) => {
                    if (e.target === this.fileModal) {
                        this.hideModal();
                    }
                });

                this.fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        this.handleFiles(e.target.files);
                        this.hideModal();
                    }
                    this.fileInput.value = '';
                });

                this.prevBtn.addEventListener('click', () => {
                    this.prevPage();
                });

                this.nextBtn.addEventListener('click', () => {
                    this.nextPage();
                });

                this.zoomInBtn.addEventListener('click', () => {
                    this.zoomIn();
                });

                this.zoomOutBtn.addEventListener('click', () => {
                    this.zoomOut();
                });

                this.resetZoomBtn.addEventListener('click', () => {
                    this.resetZoom();
                });

                this.fullscreenBtn.addEventListener('click', () => {
                    this.toggleFullscreen();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.nextPage();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.prevPage();
                    } else if (e.key === '+' || e.key === '=') {
                        e.preventDefault();
                        this.zoomIn();
                    } else if (e.key === '-') {
                        e.preventDefault();
                        this.zoomOut();
                    } else if (e.key === '0') {
                        e.preventDefault();
                        this.resetZoom();
                    } else if (e.key === 'f' || e.key === 'F') {
                        e.preventDefault();
                        this.toggleFullscreen();
                    }
                });

                // Touch events
                this.viewerArea.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.touchStartX = touch.clientX;
                    this.touchStartY = touch.clientY;
                    this.isSwiping = true;
                }, { passive: true });

                this.viewerArea.addEventListener('touchmove', (e) => {
                    if (!this.isSwiping) return;
                    const touch = e.touches[0];
                    const diffX = this.touchStartX - touch.clientX;
                    const diffY = this.touchStartY - touch.clientY;
                    
                    if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
                        e.preventDefault();
                        if (diffX > 0) {
                            this.nextPage();
                        } else {
                            this.prevPage();
                        }
                        this.isSwiping = false;
                    }
                }, { passive: false });

                this.viewerArea.addEventListener('touchend', () => {
                    this.isSwiping = false;
                }, { passive: true });

                window.addEventListener('resize', () => {
                    if (this.isPdf && this.pdfDoc) {
                        this.renderPdfPage(this.currentPage);
                    }
                });
            }

            handleFiles(fileList) {
                const supportedFiles = [];
                const imageFiles = [];
                const pdfFiles = [];

                Array.from(fileList).forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext)) {
                        imageFiles.push(file);
                    } else if (ext === 'pdf') {
                        pdfFiles.push(file);
                    }
                });

                // Сортируем и объединяем
                imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                pdfFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                
                this.files = [...imageFiles, ...pdfFiles];
                
                if (this.files.length === 0) {
                    this.showToast('Не найдено поддерживаемых файлов');
                    return;
                }

                this.renderFileList();
                this.showFile(0);
                this.showToast(`Загружено ${this.files.length} файлов`);

                if (this.files.length > 0) {
                    this.titleDisplay.textContent = `📚 ${this.files[0].name.split('.')[0]}`;
                }
            }

            renderFileList() {
                if (this.files.length === 0) {
                    this.fileList.innerHTML = `
                        <div style="color: #666; padding: 8px; text-align: center; width: 100%; font-size: 12px;">
                            Нет файлов. Выберите файлы.
                        </div>
                    `;
                    return;
                }

                this.fileList.innerHTML = '';
                this.files.forEach((file, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = `file-thumb ${index === this.currentIndex ? 'active' : ''}`;
                    
                    const ext = file.name.split('.').pop().toLowerCase();
                    const isImage = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext);
                    
                    if (isImage) {
                        const img = document.createElement('img');
                        const url = URL.createObjectURL(file);
                        img.src = url;
                        img.alt = file.name;
                        thumb.appendChild(img);
                    } else {
                        const icon = document.createElement('div');
                        icon.className = 'file-icon';
                        icon.textContent = '📄';
                        thumb.appendChild(icon);
                    }

                    const nameOverlay = document.createElement('div');
                    nameOverlay.className = 'file-name-overlay';
                    nameOverlay.textContent = file.name;
                    thumb.appendChild(nameOverlay);

                    thumb.addEventListener('click', () => {
                        this.showFile(index);
                    });

                    this.fileList.appendChild(thumb);
                });

                const activeThumb = this.fileList.querySelector('.file-thumb.active');
                if (activeThumb) {
                    activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }

            async showFile(index) {
                if (index < 0 || index >= this.files.length) return;

                this.currentIndex = index;
                const file = this.files[index];
                const ext = file.name.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext);
                const isPdf = ext === 'pdf';

                // Скрываем все
                this.imageViewer.style.display = 'none';
                this.pdfCanvas.style.display = 'none';
                this.pdfNativeViewer.style.display = 'none';
                this.pageContainer.style.display = 'flex';
                this.emptyState.style.display = 'none';
                this.isPdf = false;

                if (isImage) {
                    this.imageViewer.style.display = 'block';
                    const url = URL.createObjectURL(file);
                    this.imageViewer.src = url;
                    this.imageViewer.style.transform = `scale(${this.zoomLevel})`;
                    this.updatePageInfo(index + 1, this.files.length);
                    this.updateNavButtons();
                    this.updateFileList();

                } else if (isPdf) {
                    this.isPdf = true;
                    
                    // Пробуем использовать встроенный PDF просмотрщик
                    try {
                        // Создаем Blob URL для PDF
                        const pdfUrl = URL.createObjectURL(file);
                        
                        // Пробуем встроенный просмотр
                        this.pdfNativeViewer.style.display = 'block';
                        this.pdfNativeViewer.src = pdfUrl;
                        
                        this.totalPages = 1; // Не знаем точное количество страниц
                        this.currentPage = 1;
                        this.updatePageInfo(1, 1);
                        this.updateNavButtons();
                        this.updateFileList();
                        
                        this.showToast('PDF открыт во встроенном просмотрщике');
                        
                    } catch (error) {
                        console.error('Ошибка открытия PDF:', error);
                        this.showToast('Ошибка открытия PDF');
                        // Показываем пустое состояние
                        this.emptyState.style.display = 'block';
                        this.emptyState.querySelector('h3').textContent = 'Ошибка открытия PDF';
                        this.emptyState.querySelector('p').textContent = 'Попробуйте другой файл';
                    }
                }

                this.titleDisplay.textContent = `📚 ${file.name}`;
            }

            updatePageInfo(current, total) {
                this.pageInfo.textContent = `${current} / ${total}`;
            }

            updateNavButtons() {
                const total = this.files.length;
                this.prevBtn.disabled = this.currentIndex <= 0;
                this.nextBtn.disabled = this.currentIndex >= total - 1;
            }

            updateFileList() {
                const items = this.fileList.querySelectorAll('.file-thumb');
                items.forEach((item, index) => {
                    item.classList.toggle('active', index === this.currentIndex);
                });
            }

            nextPage() {
                if (this.currentIndex < this.files.length - 1) {
                    this.showFile(this.currentIndex + 1);
                }
            }

            prevPage() {
                if (this.currentIndex > 0) {
                    this.showFile(this.currentIndex - 1);
                }
            }

            zoomIn() {
                this.zoomLevel = Math.min(this.maxZoom, this.zoomLevel + 0.25);
                this.applyZoom();
            }

            zoomOut() {
                this.zoomLevel = Math.max(this.minZoom, this.zoomLevel - 0.25);
                this.applyZoom();
            }

            resetZoom() {
                this.zoomLevel = 1;
                this.applyZoom();
            }

            applyZoom() {
                if (!this.isPdf && this.imageViewer.style.display !== 'none') {
                    this.imageViewer.style.transform = `scale(${this.zoomLevel})`;
                }
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        if (this.viewerArea.requestFullscreen) {
                            this.viewerArea.requestFullscreen();
                        }
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            showModal() {
                this.fileModal.classList.add('active');
            }

            hideModal() {
                this.fileModal.classList.remove('active');
            }

            showToast(message) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.reader = new MangaReader();
            console.log('📚 Manga Reader запущен!');
            console.log('Поддерживаемые форматы: JPEG, PNG, PDF');
            console.log('Управление:');
            console.log('← → или свайп - переключение страниц');
            console.log('+/- - зум');
            console.log('0 - сброс зума');
            console.log('F - полный экран');
        });
    </script>
</body>
</html>
